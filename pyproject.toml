[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "data-sentinel"
version = "0.1.0"
description = "Deterministic ETL testing and data quality automation framework"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "DataSentinel" }]
license = { text = "MIT" }
keywords = ["etl", "data-quality", "testing", "reconciliation", "lineage"]

[project.optional-dependencies]
mappings = ["PyYAML>=6.0", "openpyxl>=3.1"]

[tool.setuptools]
packages = ["datasentinel"]
